name: Create release branch
run-name: >-
  ${{ inputs.mode == 'commit-version-bump'
      && format('Commit version bump {0} on {1}', inputs.version, inputs.base_branch_name)
      || format('Create release branch for {0}', inputs.release_branch_name) }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Action to perform"
        required: false
        type: choice
        options:
          - create-release-branch
          - commit-version-bump
        default: create-release-branch
      release_branch_name:
        description: "Release branch name (create-release-branch mode)"
        required: false
      version:
        description: "Application version to set (commit-version-bump mode, e.g. 2.0.1)"
        required: false
      base_branch_name:
        description: "Branch to commit the version bump onto (commit-version-bump mode)"
        required: false
permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-branch:
    name: >-
      ${{ inputs.mode == 'commit-version-bump'
          && format('Commit version bump {0}', inputs.version)
          || format('Create release branch {0}', inputs.release_branch_name) }}
    runs-on: ubuntu-latest
    steps:
    - name: Validate inputs
      run: |
        if [[ "${{ inputs.mode }}" == "commit-version-bump" ]]; then
          if [[ -z "${{ inputs.version }}" || -z "${{ inputs.base_branch_name }}" ]]; then
            echo "::error::version and base_branch_name are required when mode is 'commit-version-bump'."
            exit 1
          fi
        elif [[ -z "${{ inputs.release_branch_name }}" ]]; then
          echo "::error::release_branch_name is required when mode is 'create-release-branch'."
          exit 1
        fi
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.mode == 'commit-version-bump' && inputs.base_branch_name || 'main' }}
        fetch-depth: 0
    - name: Update application version
      working-directory: charts/hybrid-ingestion-runner
      env:
        NEW_VERSION: ${{ inputs.mode == 'commit-version-bump' && inputs.version || inputs.release_branch_name }}
      run: |
        old_version=$(cat ../../.version)
        old_re=$(printf '%s' "$old_version" | sed 's/\./\\./g')

        # update flat version file and README (dot-escaped + boundary-guarded so a
        # two-segment old version like 2.0 can't match inside unrelated numbers)
        echo "$NEW_VERSION" > ../../.version
        sed -i -E "s/(^|[^0-9A-Za-z.])${old_re}([^0-9A-Za-z.]|\$)/\1${NEW_VERSION}\2/g" ../../README.md

        export ingestion_image_version="om-$NEW_VERSION-cl-$NEW_VERSION"

        # update Helm chart version and appVersion
        yq eval -i '.version = strenv(NEW_VERSION)' Chart.yaml
        yq eval -i '.appVersion = strenv(NEW_VERSION)' Chart.yaml

        # update image tags in values.yaml
        yq eval -i '.image.tag = strenv(NEW_VERSION)' values.yaml
        yq eval -i '.config.ingestionPods.tag = strenv(ingestion_image_version)' values.yaml
    - name: Commit version bump
      if: ${{ inputs.mode == 'commit-version-bump' }}
      env:
        VERSION: ${{ inputs.version }}
        BASE_BRANCH: ${{ inputs.base_branch_name }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add .
        if git diff --cached --quiet; then
          echo "No version-bump changes to commit."
          exit 0
        fi
        git commit -m "chore(release): bump version to \`$VERSION\`"
        git push origin "HEAD:$BASE_BRANCH"
    - name: Create pull request
      if: ${{ inputs.mode != 'commit-version-bump' }}
      uses: peter-evans/create-pull-request@v7
      with:
        title: 'chore(release): Prepare ${{ inputs.release_branch_name }} release'
        body: |
          - Update application version to `${{ inputs.release_branch_name }}`
        branch: "release/${{ inputs.release_branch_name }}"
        commit-message: 'chore(release): Prepare Branch for release ${{ inputs.release_branch_name }}'
