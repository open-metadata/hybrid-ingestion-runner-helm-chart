---
{{- if and (not .Values.installArgoWorkflows) (eq .Values.config.argoWorkflows.endpoint "") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hybrid-runner
  labels:
    {{- include "hybrid-ingestion-runner.labels" . | nindent 4 }}
rules:
# Job management permissions
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
# Pod management for ingestion jobs
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "get", "list", "watch", "delete"]
# Pod logs and status with read-only access
- apiGroups: [""]
  resources: ["pods/log", "pods/status"]
  verbs: ["get", "list", "watch"]
# ConfigMap for job queue and pipeline configs
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "get", "list", "update", "patch", "delete", "watch"]
# Events for debugging
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hybrid-runner
  labels:
    {{- include "hybrid-ingestion-runner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hybrid-runner
subjects:
- kind: ServiceAccount
  name: {{ include "hybrid-ingestion-runner.serviceAccountName" . }}
  namespace: {{ include "hybrid-ingestion-runner.namespace" . }}
{{- end }}
